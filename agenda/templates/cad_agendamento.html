{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4">Novo Agendamento</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="cliente" class="form-label">Cliente *</label>
                <select class="form-select" id="cliente" name="cliente" required>
                    <option value="" disabled selected>Selecione o cliente</option>
                    {% for cliente in clientes %}
                        <option value="{{ cliente.id }}">{{ cliente.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="dia" class="form-label">Dia *</label>
                <input type="date" class="form-control" id="dia" name="dia" required>
            </div>
            <div class="mb-3">
                <label for="horario" class="form-label">Horário *</label>
                <input type="time" class="form-control" id="horario" name="horario" required>
            </div>
            <button type="submit" class="btn btn-primary">Cadastrar Agendamento</button>
        </form>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary mt-3">Voltar para o dashboard</a>
    </div>
</body>
</html>
