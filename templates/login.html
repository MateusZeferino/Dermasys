{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Tatuagem</title>
    <link href="https://fonts.googleapis.com/css2?family=Karantina:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'css\stylelogin.css'%}?=v1">
</head>
<body>
    <div class="container">
        <h1 class="main-title">INK AGENDA</h1>
        <p class="main-slogan">Faça login para acessar o sistema</p>

        <div class="login"> 
            <form method="POST" id="form-login"> {% csrf_token %%} 
                <div class="login-forms">
                    <input class="email-input" type="text" placeholder="Seu E-mail cadastrado"  name="email" required>
                </div>
                <div class="login-forms">
                    <input class="senha-input" type="password" placeholder="Senha"  name="senha" required>
                </div>
                
                {% if messages %}
                    <ul class="messages">
                        {% for message in messages %}
                            <li>{{ message }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}


                <div class="opcoes">
                    <label>
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#">Esqueci minha senha</a>
                </div>

                <button type="submit" class="login-btn">Entrar</button>
            </form>

            <div class="separator"></div>

            <p class="sem-conta">Não possui conta?</p>
            {% comment %} <a href="{% url 'cadastro_tatuador'%}"><button class="registro">CADASTRE-SE COMO TATUADOR</button></a>
            <p></p> {% endcomment %}
            <a href="{% url 'cadastro'%}"><button class="registro">CADASTRE-SE</button></a>
        </div>
    </div>
    <script src="{% static 'js/lembrar_senha.js' %}"></script>
</body>
</html>
